<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AS Pvt. Ltd. Solutions</title>
  <link rel="icon" type="image/png" href="favicon-logo.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="media.css">
  <script src="file.js" defer></script>
</head>

<body>



<header class="navbar">
    <div class="navbar-inner">

      <!-- 1. BRAND / LOGO (अब Tag सही से Closed है) -->
      <a href="#home" class="navbar-brand">
        <span class="navbar-logo">
          <img src="logo.png" alt="AS Pvt. Ltd. Solutions logo">
        </span>
        <span class="navbar-brand-name">AS PVT. LTD. SOLUTIONS</span>
      </a>

      <!-- 2. NAVIGATION LINKS -->
      <nav class="navbar-links" id="navbarLinks">
        <a href="#home" class="navbar-link">Home</a>
        <a href="#about" class="navbar-link">About</a>
        <a href="#services" class="navbar-link">Services</a>
        <a href="#contact" class="navbar-link">Contact</a>
      </nav>

      <!-- 3. HAMBURGER BUTTON PHONE NABBAR BUTTONES -->
      <button class="navbar-toggle" id="navbarToggle" aria-label="Toggle menu" aria-expanded="false"
        aria-controls="navbarLinks">
        <span class="icon-bar"></span>
        <span class="icon-bar"></span>
        <span class="icon-bar"></span>
      </button>

    </div>
  </header>



  <!-- ============ HERO SECTION ============ -->
  <section id="home" class="hero hero-section"  >

    <!-- decorative blue blob shapes -->
    <div class="blob blob-top"></div>
    <div class="blob blob-bottom"></div>

    <div class="hero-inner">
      <div class="hero-card">

        <h1 class="hero-title">
          Smart Digital<br>
          <strong>Solution</strong>
        </h1>

        <p class="hero-copy">
          INNOVATIVE IT SERVICES, WEB DEVELOPMENT, AND DIGITAL
          STRATEGIES BUILT TO GROW YOUR BRAND.
        </p>

        <button class="cta-btn">GET STARTED</button>
      </div>





<!-- ==========================================
     POP-UP LEAD FORM (GET STARTED BUTTON KE LIYE)
     ========================================== -->
<div class="modal-overlay" id="contactModal">
  <div class="modal-card">
    
    <!-- Modal ko close karne ke liye Cross (X) Button -->
    <button class="modal-close" id="closeModal">&times;</button>
    
    <!-- Form ki Heading aur Sub-heading -->
    <h2>Let's Build Something Great!</h2>
    <p>Fill out the details and our team will get back to you in 24 hours.</p>
    
    <!-- Main Input Form -->
    <form id="leadForm">
      <input type="text" placeholder="Your Name" required>
      <input type="email" placeholder="Your Email" required>
      <textarea placeholder="Tell us about your project..." rows="4" required></textarea>
      
      <!-- Submit Button -->
      <button type="submit" class="cta-btn">Send Message</button>
    </form>

  </div>
</div>

      <!-- Right: image -->
      <div class="hero-media">
        <img src="heroimage.png"
          alt="Laptop displaying brand strategy dashboard">
      </div>

    </div>
  </section>


































      


  
</body>
</html>
